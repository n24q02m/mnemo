[project]
name = "mnemo-mcp"
version = "2.21.1"
description = "Renamed to n24q02m-mnemo. Transitional stub that installs n24q02m-mnemo."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = "==3.13.*"
dependencies = ["n24q02m-mnemo>=2.21.0"]

[project.urls]
Homepage = "https://github.com/n24q02m/mnemo"
Source = "https://github.com/n24q02m/mnemo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No importable package. `uvx mnemo-mcp` only resolves executables owned by the
# requested distribution, so the stub re-declares the legacy command and points
# it at the entry point shipped by n24q02m-mnemo (identical wrapper to the alias there).
[project.scripts]
mnemo-mcp = "mnemo.cli:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true
