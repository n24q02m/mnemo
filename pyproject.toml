[project]
name = "mnemo-mcp"
version = "2.17.3"
description = "Open-source MCP Server for persistent AI memory"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "memory", "ai-memory", "sqlite", "embeddings", "claude", "cursor", "copilot", "antigravity", "codex", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = "==3.13.*"
dependencies = [
    # MCP Server
    "mcp[cli]<3",
    # HTTP Client (for embedding API calls)
    "httpx",
    # Config
    "pydantic",
    # 2.15 warns while constructing MCP SDK Settings; lift after upstream rebuilds its model.
    "pydantic-settings>=2.14.2,<2.15",
    # Logging
    "loguru",
    # SQLite vector search
    "sqlite-vec",
    # Local ONNX embedding (auto-fallback when no cloud API)
    "fastretrieval>=1.7.2,<2",
    # Shared stack core (de-host 2026-09): token auth 3-mode, per-task model cells,
    # limiter, lifecycle lock, OpenAI-spec provider client. Git dep, pinned rev.
    "hull-core",
    # Pin Pygments to fix ReDoS (CVE in <2.20.0)
    "Pygments>=2.21.0",
    "alembic>=1.20.0",
    # Phase 2: token counting for LLM compression pipeline
    "tiktoken>=0.14.0",
    # idna floor patches CVE-2026-45409 (reached transitively via httpx chains).
    "idna>=3.20",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
    "ty",
    "pre-commit",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "syrupy>=6.1.1",
    "bandit>=1.9.4",
]

[tool.uv.sources]
# Shared stack core (auth 3-mode, per-task model cells, limiter, lifecycle).
# Pinned to the reviewed revision; bump deliberately, never via lockfile refresh.
hull-core = { git = "https://github.com/n24q02m/hull.git", rev = "5262d54f4f0c1214dcedaef20531da98f9519bdf", subdirectory = "packages/core-py" }

[project.scripts]
mnemo-mcp = "mnemo_mcp.cli:main"
mnemo-pilot = "mnemo_cli.__main__:main"
mnemo = "mnemo_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/n24q02m/mnemo-mcp"
Repository = "https://github.com/n24q02m/mnemo-mcp.git"
Issues = "https://github.com/n24q02m/mnemo-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo_mcp", "src/mnemo_core", "src/mnemo_cli"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "src/mnemo_mcp/**/*.py",
    "src/mnemo_mcp/**/*.md",
    "src/mnemo_mcp/**/*.ini",
    "src/mnemo_mcp/**/*.mako",
    "src/mnemo_mcp/alembic/README",
    "src/mnemo_mcp/py.typed",
    "src/mnemo_core/**/*.py",
    "src/mnemo_cli/**/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 30
markers = [
    "integration: integration tests (require network/services)",
    "live: live MCP protocol tests (spawn real server via stdio)",
    "full: full live tests with real services",
    "e2e: end-to-end MCP protocol tests (3 setup modes)",
    "slow: slow tests (skippable with -m 'not slow')",
]
addopts = "-m 'not integration and not live and not full and not e2e'"

[tool.ty]
rules = { unresolved-import = "ignore", unresolved-attribute = "ignore", possibly-missing-attribute = "ignore" }

# Local worktree checkouts are not part of the source tree; without this the
# pre-commit ty hook lints stale copies under .worktrees/ and fails on
# diagnostics that were fixed long ago in the real tree.
[tool.ty.src]
exclude = [".worktrees/**"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version", "server.json:version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/mnemo_mcp"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
