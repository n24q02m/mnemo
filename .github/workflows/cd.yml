# =============================================================================
# CD Template: Python. Publish steps are opt-in per repo via
# vars.PUBLISH_PYPI / vars.PUBLISH_MCP_REGISTRY.
# Managed by n24q02m repo-bootstrap; local changes may be overwritten.
#
# Pipeline: PSR v10 -> PyPI -> MCP Registry
# CUSTOMIZE: Search for "# CUSTOMIZE:" comments and adjust for your repo.
# =============================================================================
name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      force:
        description: "Force release level (when no version-worthy commits)"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - prerelease
          - patch
          - minor
          - major
      publish_existing_tag:
        description: "Recovery only: publish an already-created tag (e.g. v3.1.0), skipping semantic-release. Use when the auto-computed version's tag name is permanently reserved by a GitHub immutable release."
        required: false
        type: string
        default: ""
      legacy_final_note:
        description: "One-time: also publish the FINAL mnemo-mcp stub (legacy/mnemo-mcp: rename note + legacy mnemo-mcp command, depends on n24q02m-mnemo) before the old PyPI project freezes. Set true only on the first n24q02m-mnemo release."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Release lane: dispatch-only (release_type=beta, then stable); a push never releases.
  RELEASE_TYPE: ${{ inputs.release_type }}

# A release must finish once started: cancelling it between the version tag and the
# registry upload strands a tag with no artifact, so the group serializes dispatches.
# ci-policy: allow concurrency reason: serialize releases, never cancel one mid-publish
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================================
  # README registry metadata: the package carries the repo's README to PyPI, so
  # a manifest that names a file which is not there publishes an empty project
  # page. Runs before the release rather than beside it -- a PyPI upload cannot
  # be undone, only yanked.
  # ============================================================================
  readme-sync:
    name: Verify README registry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # ============================================================================
  # Release: PSR v10
  # ============================================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.released || steps.forced.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.forced.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.forced.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease || steps.forced.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Version bump runs on the fork (orphan-tag + registry-collision guards).
      # The publish step below stays upstream — the fork does not replace it.
      - uses: n24q02m/better-semantic-release@0cc137a9f9254fb4163d727c20026cb81a5a6880 # v1.13.1
        id: release
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta
          force: ${{ inputs.force != 'none' && inputs.force || '' }}

      - uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: inputs.publish_existing_tag == '' && steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Use existing tag (immutable-release recovery)
        id: forced
        if: inputs.publish_existing_tag != ''
        run: |
          TAG="${{ inputs.publish_existing_tag }}"
          VERSION="${TAG#v}"
          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=false"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Notify Downstream
  # ============================================================================
  # A core/shared repo cutting a stable release has to open a tracking issue in
  # every repo that pins it, or downstream pins drift silently. The dispatch goes
  # to one hub repo that fans the issues out; `n24q02m/n24q02m` is that hub as a
  # literal, copied from the repo this template was measured against rather than
  # derived from `n24q02m` -- the hub happening to share the owner's name is not
  # a rule this template gets to assume.
  #
  # Stable only: `is_prerelease != 'true'`. A beta cutting downstream issues would
  # file the same issue again at stable.
  #
  # New repositories and repositories already using the gate require
  # NOTIFY_DOWNSTREAM, because this template also lands on non-core Python repos.
  # During retrofit, an existing ungated notify-downstream job stays ungated:
  # silently adding an unset-variable gate would stop a live release behavior.
  # apply.py detects only that existing job block; it does not infer core status
  # from a repository name.
  notify-downstream:
    name: Notify Downstream
    needs: [release]
    if: >-
      needs.release.outputs.released == 'true'
      && needs.release.outputs.is_prerelease != 'true'
      && vars.NOTIFY_DOWNSTREAM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          # Without owner/repositories the token is scoped to THIS repo only
          # and the dispatch 403s ("Resource not accessible by integration").
          # Scope to the target repo, nothing more.
          owner: n24q02m
          repositories: n24q02m

      - name: Dispatch core-update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/n24q02m/n24q02m/dispatches \
            -f event_type=core-update \
            -f 'client_payload[core]=mnemo' \
            -f 'client_payload[version]=${{ needs.release.outputs.version }}' \
            -f 'client_payload[tag]=${{ needs.release.outputs.tag }}' \
            -f 'client_payload[release_url]=https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}'

  # ============================================================================
  # Publish to PyPI
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: [readme-sync, release]
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # ============================================================================
  # One-time legacy final-note: publish the LAST mnemo-mcp release -- a stub that
  # only notes the rename to n24q02m-mnemo, re-declares the legacy `mnemo-mcp`
  # command and depends on n24q02m-mnemo, so the old PyPI project freezes at that
  # stub. It lives in legacy/mnemo-mcp at a version one patch above the last real
  # mnemo-mcp release (2.21.0 -> 2.21.1), so it can never overtake a real release
  # and no version rewrite happens here. Gated by the legacy_final_note dispatch
  # input so it runs exactly once. PyPI trusted publishing (OIDC) like
  # publish-pypi: no token; the mnemo-mcp trusted publisher on PyPI must point at
  # this repo with environment `pypi` before the dispatch.
  # ============================================================================
  publish-pypi-legacy-final:
    name: Publish mnemo-mcp final rename stub
    needs: release
    if: >-
      inputs.legacy_final_note
      && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the legacy stub
        run: uv build --out-dir dist-legacy legacy/mnemo-mcp

      # A PyPI version number can never be reused, so prove the artifact is the
      # intended stub before uploading: legacy name, bumped version, inactive
      # classifier, dependency on the renamed distribution, legacy console script.
      - name: Verify the built artifact is the legacy stub
        run: |
          ls dist-legacy
          python3 - <<'EOF'
          import glob
          import pathlib
          import sys
          import tomllib
          import zipfile

          (stub_pyproject,) = pathlib.Path("legacy").glob("*/pyproject.toml")
          project = tomllib.loads(stub_pyproject.read_text(encoding="utf-8"))["project"]
          dist_key = project["name"].replace("-", "_")
          dist_info = f"{dist_key}-{project['version']}.dist-info"
          wheels = glob.glob(f"dist-legacy/{dist_key}-{project['version']}-*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, got {wheels}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = wheel.read(f"{dist_info}/METADATA").decode()
              entry_points = wheel.read(f"{dist_info}/entry_points.txt").decode()

          expected = [
              f"Name: {project['name']}",
              f"Version: {project['version']}",
              "Classifier: Development Status :: 7 - Inactive",
              *(f"Requires-Dist: {dep}" for dep in project["dependencies"]),
          ]
          missing = [line for line in expected if line not in metadata]
          missing += [
              f"{script} = "
              for script in project["scripts"]
              if f"{script} = " not in entry_points
          ]
          if missing:
              sys.exit(f"legacy stub metadata mismatch: {missing}")
          print(f"OK: {project['name']} {project['version']}")
          EOF

      - name: Publish the final mnemo-mcp stub to PyPI
        run: uv publish dist-legacy/*

  # ============================================================================
  # Publish to MCP Registry (stable only)
  # ============================================================================
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-pypi]
    if: >-
      needs.release.outputs.released == 'true'
      && needs.release.outputs.is_prerelease != 'true'
      && vars.PUBLISH_PYPI == 'true'
      && vars.PUBLISH_MCP_REGISTRY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update server.json version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages = [.packages[] |
              if .registryType == "oci" then del(.version)
              else .version = $v
              end
            ]
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set +e
          out=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$out"
          set -e
          if [ $rc -ne 0 ] && echo "$out" | grep -q "cannot publish duplicate version"; then
            echo "duplicate version already in registry - idempotent recovery, treating as success"
            exit 0
          fi
          exit $rc

  # ============================================================================
  # Sync to Plugin Marketplace
  # ============================================================================
  sync-marketplace:
    name: Sync to Marketplace
    needs: [release, publish-mcp-registry]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          repositories: claude-plugins

      - name: Dispatch plugin sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/n24q02m/claude-plugins/dispatches \
            -f event_type=plugin-sync \
            -f 'client_payload[repo]=mnemo' \
            -f 'client_payload[tag]=${{ needs.release.outputs.tag }}'
